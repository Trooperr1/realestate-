  <g>
    <circle cx="516" cy="1044" r="4" fill="#FFFFFF"/>
    <circle cx="540" cy="1044" r="4" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="564" cy="1044" r="4" fill="#FFFFFF" opacity="0.35"/>
  </g>
</svg>
