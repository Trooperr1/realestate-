  <ellipse cx="200" cy="784" rx="26" ry="18" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>

  <!-- copy, left half -->
  <text x="140" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16"
        letter-spacing="5" fill="#FFFFFF" opacity="0.6">02 &#47; 03</text>
