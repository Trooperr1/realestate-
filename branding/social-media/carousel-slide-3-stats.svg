<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1080" fill="#0A0A0A"/>

  <circle cx="90" cy="90" r="30" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <text x="93" y="100" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#FFFFFF">C</text>
  <text x="1000" y="96" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" letter-spacing="6" fill="#FFFFFF" opacity="0.85">COFIMO</text>

  <text x="140" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16"
        letter-spacing="5" fill="#FFFFFF" opacity="0.6">03 &#47; 03</text>
  <text x="136" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#FFFFFF">Floor Plan &amp; Specification</text>

  <!-- floor plan -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.75">
    <rect x="140" y="300" width="360" height="520" fill="none"/>
    <line x1="140" y1="480" x2="500" y2="480"/>
    <line x1="140" y1="620" x2="500" y2="620"/>
    <line x1="320" y1="480" x2="320" y2="620"/>
  </g>
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="2" fill="#FFFFFF" opacity="0.6">
    <text x="320" y="394" text-anchor="middle">LIVING ROOM</text>
    <text x="230" y="554" text-anchor="middle">KITCHEN</text>
    <text x="410" y="548" text-anchor="middle">PRIMARY</text>
    <text x="410" y="564" text-anchor="middle">SUITE</text>
    <text x="320" y="724" text-anchor="middle">DEN</text>
  </g>

  <!-- spec table -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#FFFFFF">
    <line x1="620" y1="300" x2="960" y2="300" stroke="#FFFFFF" opacity="0.4"/>
    <text x="620" y="345" opacity="0.6" letter-spacing="2">BEDROOMS</text>
    <text x="960" y="345" text-anchor="end">4</text>
    <line x1="620" y1="373" x2="960" y2="373" stroke="#FFFFFF" opacity="0.2"/>
    <text x="620" y="410" opacity="0.6" letter-spacing="2">BATHROOMS</text>
    <text x="960" y="410" text-anchor="end">5</text>
    <line x1="620" y1="438" x2="960" y2="438" stroke="#FFFFFF" opacity="0.2"/>
    <text x="620" y="475" opacity="0.6" letter-spacing="2">INTERIOR</text>
    <text x="960" y="475" text-anchor="end">6,200 SQ FT</text>
    <line x1="620" y1="503" x2="960" y2="503" stroke="#FFFFFF" opacity="0.2"/>
    <text x="620" y="540" opacity="0.6" letter-spacing="2">LOT SIZE</text>
    <text x="960" y="540" text-anchor="end">0.8 ACRES</text>
    <line x1="620" y1="568" x2="960" y2="568" stroke="#FFFFFF" opacity="0.2"/>
    <text x="620" y="605" opacity="0.6" letter-spacing="2">YEAR BUILT</text>
    <text x="960" y="605" text-anchor="end">2024</text>
    <line x1="620" y1="633" x2="960" y2="633" stroke="#FFFFFF" opacity="0.4"/>
  </g>

  <rect x="330" y="900" width="420" height="70" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <text x="540" y="943" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="15" letter-spacing="3" fill="#FFFFFF">SCHEDULE A PRIVATE VIEWING</text>

  <text x="540" y="1000" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="13" letter-spacing="3" fill="#FFFFFF" opacity="0.5">COFIMO.COM&#47;PARKVIEW</text>

  <g>
    <circle cx="516" cy="1044" r="4" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="540" cy="1044" r="4" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="564" cy="1044" r="4" fill="#FFFFFF"/>
  </g>
</svg>
